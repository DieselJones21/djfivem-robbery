<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Crime Tablet</title>
</head>
<body>
    <div id="app" class="hidden">
        <div class="tablet">
            <header class="nav">
                <div class="brand">
                    <span class="mark"></span>
                    <div>
                        <p class="eyebrow">Contracts</p>
                        <h1 id="greeting">Operator</h1>
                    </div>
                </div>
                <nav class="tabs" id="typeTabs"></nav>
                <div class="nav-right">
                    <div class="userchip">
                        <div>
                            <strong id="cooldownLabel">Ready</strong>
                            <span>Personal cooldown</span>
                        </div>
                        <div class="avatar">OP</div>
                    </div>
                    <button id="closeBtn" class="icon-btn" title="Close">✕</button>
                </div>
            </header>

            <section class="metrics" id="metrics"></section>

            <main>
                <section class="detail">
                    <div class="hero">
                        <img id="heroImage" alt="" />
                        <div class="hero-fade">
                            <p class="hero-kicker" id="heroKicker">Select a contract</p>
                            <h2 id="heroTitle">Choose a target</h2>
                        </div>
                    </div>
                    <div class="detail-body">
                        <p id="heroDesc" class="desc">Pick a job from the list to see the photo, kit, and crew size.</p>
                        <div>
                            <p class="section-label">Required items</p>
                            <div id="itemRow" class="item-row"></div>
                        </div>
                        <div class="detail-meta" id="detailMeta"></div>
                        <div id="crewBox" class="crew-box">
                            <p class="muted" id="crewEmpty">Select a target to form a crew.</p>
                            <div id="crewBody" class="hidden">
                                <p class="section-label">Crew</p>
                                <ul id="memberList"></ul>
                                <div id="nearbyList" class="nearby hidden"></div>
                                <div class="actions">
                                    <button id="inviteBtn" class="btn ghost">Invite nearby</button>
                                    <button id="startBtn" class="btn primary">Start robbery</button>
                                    <button id="leaveBtn" class="btn danger">Leave crew</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <aside class="list-pane">
                    <div class="list-head">
                        <h3 id="listTitle">Targets</h3>
                        <p id="listSub">No cops required</p>
                    </div>
                    <div id="locationList" class="target-list"></div>
                </aside>
            </main>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
